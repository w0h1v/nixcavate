# cargo-deny: license and advisory policy.

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MIT-0",
    "BSL-1.0",
    "CC0-1.0",
    "bzip2-1.0.6", # the bzip2 decoder: a permissive BSD-style license
]
confidence-threshold = 0.9

[licenses.private]
# The workspace's own crates are unpublished and carry no SPDX license yet.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
