name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # The release artifact: one static binary with no runtime dependencies.
  static-musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target x86_64-unknown-linux-musl -p nixcavate
      - name: The binary is static and runs
        run: |
          bin=target/x86_64-unknown-linux-musl/release/nixcavate
          file "$bin" | grep -q "static"
          "$bin" list > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: nixcavate-x86_64-linux-musl
          path: target/x86_64-unknown-linux-musl/release/nixcavate

  # A short budget per target on every change; run longer before a release (fuzz/run.sh 600).
  fuzz:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - run: fuzz/run.sh 30

  # Fails when the synthetic corpus parses more than 15% slower than the stored baseline, or
  # when its record counts change (bench/README.md).
  bench:
    runs-on: ubuntu-latest
    env:
      NIXCAVATE_BENCH_MACHINE: github-ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p nixcavate
      - run: python3 bench/gen_corpus.py "$RUNNER_TEMP/synth-linux" --mib 512
      - run: python3 bench/bench.py synth-linux-512 "$RUNNER_TEMP/synth-linux"
