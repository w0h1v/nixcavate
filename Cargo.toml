[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "LicenseRef-Proprietary" # no license has been chosen yet
publish = false

# Every dependency needs a reason.
[workspace.dependencies]
nixcavate-core = { path = "crates/nixcavate-core" }
nixcavate-source = { path = "crates/nixcavate-source" }
nixcavate-artifacts = { path = "crates/nixcavate-artifacts" }
nixcavate-fs = { path = "crates/nixcavate-fs" }

# CLI argument parsing.
clap = { version = "4.6", features = ["derive"] }
# Record serialization; manifest and Sigma JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Global allocator. Required for static musl builds: musl's malloc is slow under threads.
mimalloc = { version = "0.1", default-features = false }
# Zero-copy reads of evidence files and timeline runs.
memmap2 = "0.9"
# SIMD line and delimiter search on the text hot path.
memchr = "2"
# Integer and float formatting without std::fmt.
itoa = "1"
ryu = "1"
# Archives read in place.
tar = { version = "0.4", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate"] }
# Compressed log rotations, archives and journald objects.
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
zstd = "0.14"
xz2 = { version = "0.1", features = ["static"] } # never link a system liblzma
lz4_flex = "0.14"
# macOS property lists (XML and binary).
plist = "1.10"
# SQLite artifacts (browser history, TCC, KnowledgeC). Bundled; evidence is copied to scratch
# and queried there, never opened in place.
rusqlite = { version = "0.42", features = ["bundled", "limits"] }
# SSH key fingerprints (SHA256), to match keys against sshd log lines.
sha2 = "0.10"
# Persistence-hunter allow/block profiles: pure-Rust serde YAML parser, no unsafe, no libyaml.
serde-saphyr = "2.1"
# Snapshot tests (dev only).
insta = "1.49"

[workspace.lints.rust]
# The one exception is the memory map in nixcavate-source.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
too_many_arguments = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind" # the scheduler isolates parser panics with catch_unwind
debug = "line-tables-only" # readable flamegraphs at no runtime cost
strip = false

[profile.dev.package."*"]
opt-level = 2 # keep tests on real fixtures fast
