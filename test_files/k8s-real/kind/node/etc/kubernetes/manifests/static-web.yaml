apiVersion: v1
kind: Pod
metadata:
  name: static-web
  namespace: kube-system
spec:
  hostNetwork: true
  hostPID: true
  containers:
    - name: web
      image: busybox:1.37
      command: ["sh", "-c", "while true; do echo static-alive; sleep 20; done"]
      securityContext:
        privileged: true
      volumeMounts:
        - {name: root, mountPath: /host}
  volumes:
    - name: root
      hostPath: {path: /}
