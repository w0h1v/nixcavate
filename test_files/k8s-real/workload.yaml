apiVersion: v1
kind: Pod
metadata: {name: priv-host, namespace: default}
spec:
  hostPID: true
  containers:
    - name: shell
      image: busybox:1.37
      command: ["sh", "-c", "echo privileged-start; ls /host/etc | head -3; sleep 3600"]
      securityContext: {privileged: true}
      volumeMounts: [{name: root, mountPath: /host}]
  volumes:
    - name: root
      hostPath: {path: /}
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: ticker, namespace: default}
spec:
  schedule: "* * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: tick
              image: busybox:1.37
              command: ["sh", "-c", "echo cron-run $(date +%s); echo cron-warn >&2"]
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: agentd, namespace: default}
spec:
  selector: {matchLabels: {app: agentd}}
  template:
    metadata: {labels: {app: agentd}}
    spec:
      containers:
        - name: agent
          image: busybox:1.37
          command: ["sh", "-c", "while true; do echo agentd-heartbeat; sleep 15; done"]
---
apiVersion: v1
kind: Pod
metadata: {name: badpull, namespace: default}
spec:
  containers:
    - name: nope
      image: registry.invalid/nope:1
---
apiVersion: v1
kind: Secret
metadata: {name: db-pass, namespace: default}
stringData: {password: "example-Passw0rd-planted"}
---
apiVersion: v1
kind: Pod
metadata: {name: secret-user, namespace: default}
spec:
  containers:
    - name: c
      image: busybox:1.37
      command: ["sh", "-c", "echo secret-mounted; cat /etc/s/password; echo; sleep 3600"]
      volumeMounts: [{name: s, mountPath: /etc/s}]
  volumes:
    - name: s
      secret: {secretName: db-pass}
---
apiVersion: v1
kind: Service
metadata: {name: web-np, namespace: default}
spec:
  type: NodePort
  selector: {app: web}
  ports: [{port: 80, targetPort: 80, nodePort: 30080}]
---
apiVersion: v1
kind: Pod
metadata: {name: longline, namespace: default}
spec:
  restartPolicy: Never
  containers:
    - name: c
      image: busybox:1.37
      command: ["sh", "-c", "head -c 40000 /dev/zero | tr '\\0' 'x'; echo; echo after-long-line"]
