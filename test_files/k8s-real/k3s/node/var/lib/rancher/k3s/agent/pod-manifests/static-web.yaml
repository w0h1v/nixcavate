apiVersion: v1
kind: Pod
metadata:
  name: static-web
  namespace: kube-system
spec:
  hostNetwork: true
  containers:
    - name: web
      image: nginx:1.27-alpine
      args: ["nginx", "-g", "daemon off;"]
      volumeMounts:
        - {name: sock, mountPath: /var/run/docker.sock}
  volumes:
    - name: sock
      hostPath: {path: /var/run/docker.sock}
