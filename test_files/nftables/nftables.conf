table ip filter {
	chain LOGDROP {
		counter packets 0 bytes 0 drop
	}

	chain INPUT {
		type filter hook input priority filter; policy drop;
		iifname "lo" counter packets 0 bytes 0 accept
		ct state related,established counter packets 0 bytes 0 accept
		ip saddr 198.51.100.0/24 tcp dport 22 counter packets 0 bytes 0 accept
		meta l4proto tcp tcp dport { 80, 443 } counter packets 0 bytes 0 accept
		ip saddr != 203.0.113.0/24 ip daddr 192.0.2.53 udp dport 53 counter packets 0 bytes 0 accept
		 counter packets 0 bytes 0 jump LOGDROP
	}

	chain FORWARD {
		type filter hook forward priority filter; policy accept;
		meta l4proto icmp counter packets 0 bytes 0 reject
	}
}
table ip nat {
	chain POSTROUTING {
		type nat hook postrouting priority srcnat; policy accept;
		oifname "eth0" ip saddr 192.0.2.0/24 counter packets 0 bytes 0 masquerade
	}
}
table ip6 filter {
	chain INPUT {
		type filter hook input priority filter; policy drop;
		meta l4proto ipv6-icmp counter packets 0 bytes 0 accept
		ip6 saddr 2001:db8::/32 tcp dport 22 counter packets 0 bytes 0 accept
	}
}
table inet filter {
	set blocked {
		type ipv4_addr
		flags interval
		elements = { 192.0.2.99, 203.0.113.0/24 }
	}

	chain input {
		type filter hook input priority filter; policy drop;
		iif "lo" accept
		ct state established,related accept
		tcp dport { 22, 80, 443 } accept
		ip saddr 198.51.100.0/24 counter packets 0 bytes 0 drop
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}
