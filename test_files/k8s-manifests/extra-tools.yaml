apiVersion: v1
kind: Namespace
metadata:
  name: tools
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-helper
  namespace: tools
spec:
  selector:
    matchLabels: {app: node-helper}
  template:
    metadata:
      labels: {app: node-helper}
    spec:
      hostPID: true
      hostNetwork: true
      containers:
        - name: helper
          image: busybox:1.37
          command: ["sh", "-c", "while true; do echo helper-alive; sleep 20; done"]
          securityContext:
            privileged: true
          volumeMounts:
            - name: host
              mountPath: /host
      volumes:
        - name: host
          hostPath:
            path: /
