<IfModule security2_module>
  SecRule ARGS|REQUEST_URI "@rx (?i:union\s+select|'\s*or\s*'1'\s*=\s*'1)" "id:900010,phase:2,deny,status:403,log,msg:'SQL injection attempt',severity:CRITICAL,tag:'attack-sqli'"
  SecRule ARGS:testparam "@contains nxblock" "id:900001,phase:2,deny,status:403,log,msg:'Test rule hit'"
</IfModule>
