[package]
name = "nixcavate-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

# Not a member of the main workspace: fuzzing needs a nightly toolchain and its own lock file.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
nixcavate-core = { path = "../crates/nixcavate-core" }
nixcavate-source = { path = "../crates/nixcavate-source" }
nixcavate-artifacts = { path = "../crates/nixcavate-artifacts" }
nixcavate-fs = { path = "../crates/nixcavate-fs" }
# Already in the lock file through nixcavate-source; decompresses the ext4_journal base images.
zstd = "0.14"

[profile.release]
debug = 1

[[bin]]
name = "aix_sh_history"
path = "fuzz_targets/aix_sh_history.rs"
test = false
doc = false
